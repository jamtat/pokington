[package]
name = "pokington"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wreq = { version = "=0.16.3", features = ["gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "=0.2.0", features = ["emulation-compression"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
ratatui = { version = "0.30.1", default-features = false }
ratatui-image = { version = "=11.1.0", default-features = false }
rustix = { version = "0.38", features = ["termios", "stdio", "fs"] }

[dev-dependencies]
nix = { version = "0.31", features = ["term", "fs"] }
base64 = "0.22"
