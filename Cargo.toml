[package]
name = "pokington"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "zstd"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
ratatui = { version = "0.30.1", default-features = false }
ratatui-image = { version = "=11.1.0", default-features = false }
rustix = { version = "0.38", features = ["termios", "stdio", "fs"] }
clap = { version = "4.6.7", features = ["derive"] }
rand = { version = "0.10.3", features = ["unbiased"] }

[dev-dependencies]
nix = { version = "0.31", features = ["term", "fs"] }
base64 = "0.22"

[lints.clippy]
pedantic = { level = "deny", priority = -1 } # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }  # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
