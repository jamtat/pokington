name: Rust environment
description: Use the repository toolchain and cache dependencies without Homebrew setup.
inputs:
  target:
    description: Optional Rust target
    default: ""
  components:
    description: Optional space-separated Rust components
    default: ""
  cache-key:
    description: Stable cache scope for the build mode and target
    required: true
runs:
  using: composite
  steps:
    - name: Select repository toolchain
      shell: bash
      env:
        RUST_TARGET: ${{ inputs.target }}
        RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        rustup show active-toolchain || rustup toolchain install
        if [[ -n "$RUST_TARGET" ]]; then
          rustup target add "$RUST_TARGET"
        fi
        if [[ -n "$RUST_COMPONENTS" ]]; then
          read -r -a components <<< "$RUST_COMPONENTS"
          rustup component add "${components[@]}"
        fi
        {
          echo 'CARGO_INCREMENTAL=0'
          echo 'CARGO_PROFILE_DEV_DEBUG=0'
          echo 'CARGO_TERM_COLOR=always'
        } >> "$GITHUB_ENV"
    - name: Cache Rust dependencies and tools
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        cache-on-failure: true
